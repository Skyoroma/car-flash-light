# Compile automatiquement le programme de l'ESP32 à chaque modification du dépôt.
# Le résultat s'affiche dans l'onglet « Actions » et dans le badge « build » du README.
name: Compilation firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:FlashMode=qio,PSRAM=disabled,FlashSize=16M,PartitionScheme=app3M_fat9M_16MB
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          sketch-paths: |
            - firmware/flash_esp32
